<svg width="860" height="278" viewBox="0 0 860 278" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">

  <!-- Alternating row backgrounds (timeline area only) -->
  <rect x="158" y="38" width="702" height="44" fill="#f8fafc"/>
  <rect x="158" y="126" width="702" height="44" fill="#f8fafc"/>

  <!-- Left label column -->
  <rect x="0" y="38" width="158" height="176" fill="#f1f5f9"/>
  <line x1="158" y1="38" x2="158" y2="214" stroke="#94a3b8" stroke-width="1"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="860" height="38" fill="#1e3a5f"/>
  <text x="79"  y="23" text-anchor="middle" fill="white"   font-size="9"  font-weight="bold">Track</text>
  <text x="330" y="14" text-anchor="middle" fill="#93c5fd" font-size="8.5" font-weight="bold">Phase 1 (Months 0–12)</text>
  <text x="670" y="14" text-anchor="middle" fill="#6ee7b7" font-size="8.5" font-weight="bold">Phase 2 (Months 12–24)</text>
  <text x="852" y="14" text-anchor="start"  fill="#fcd34d" font-size="8"                    >Ph.3+</text>

  <!-- Month labels in header -->
  <!-- M0=160  M3=245  M6=330  M9=415  M12=500  M15=585  M18=670  M21=755  M24=840 -->
  <text x="160" y="30" text-anchor="middle" fill="white" font-size="8.5">M0</text>
  <text x="245" y="30" text-anchor="middle" fill="white" font-size="8.5">M3</text>
  <text x="330" y="30" text-anchor="middle" fill="white" font-size="8.5">M6</text>
  <text x="415" y="30" text-anchor="middle" fill="white" font-size="8.5">M9</text>
  <text x="500" y="30" text-anchor="middle" fill="white" font-size="9"   font-weight="bold">M12</text>
  <text x="585" y="30" text-anchor="middle" fill="white" font-size="8.5">M15</text>
  <text x="670" y="30" text-anchor="middle" fill="white" font-size="8.5">M18</text>
  <text x="755" y="30" text-anchor="middle" fill="white" font-size="8.5">M21</text>
  <text x="840" y="30" text-anchor="middle" fill="white" font-size="9"   font-weight="bold">M24</text>

  <!-- Vertical gridlines -->
  <line x1="160" y1="38" x2="160" y2="214" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="245" y1="38" x2="245" y2="214" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="330" y1="38" x2="330" y2="214" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="415" y1="38" x2="415" y2="214" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="500" y1="38" x2="500" y2="214" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="585" y1="38" x2="585" y2="214" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="670" y1="38" x2="670" y2="214" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="755" y1="38" x2="755" y2="214" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="840" y1="38" x2="840" y2="214" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Horizontal row dividers -->
  <line x1="0" y1="82"  x2="860" y2="82"  stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="126" x2="860" y2="126" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="170" x2="860" y2="170" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="214" x2="860" y2="214" stroke="#94a3b8" stroke-width="1"/>

  <!-- ── TRACK LABELS (left column) ── -->
  <text x="79" y="57"  text-anchor="middle" fill="#1e40af" font-size="8.5" font-weight="bold">1. Data &amp;</text>
  <text x="79" y="69"  text-anchor="middle" fill="#1e40af" font-size="8.5" font-weight="bold">Infrastructure</text>
  <text x="79" y="101" text-anchor="middle" fill="#5b21b6" font-size="8.5" font-weight="bold">2. Model &amp;</text>
  <text x="79" y="113" text-anchor="middle" fill="#5b21b6" font-size="8.5" font-weight="bold">Analytics</text>
  <text x="79" y="145" text-anchor="middle" fill="#92400e" font-size="8.5" font-weight="bold">3. Institutional &amp;</text>
  <text x="79" y="157" text-anchor="middle" fill="#92400e" font-size="8.5" font-weight="bold">Governance</text>
  <text x="79" y="189" text-anchor="middle" fill="#065f46" font-size="8.5" font-weight="bold">4. Clinical</text>
  <text x="79" y="201" text-anchor="middle" fill="#065f46" font-size="8.5" font-weight="bold">Validation</text>

  <!-- ══ TRACK 1: Data & Infrastructure  (bar y=49, h=22) ══ -->
  <!-- Environment & pipeline setup: M0–M3 -->
  <rect x="160" y="49" width="85"  height="22" rx="3" fill="#1d4ed8"/>
  <text x="202" y="63" text-anchor="middle" fill="white" font-size="7.5" font-weight="bold">Env. setup</text>
  <!-- Data collection (ongoing): M3–M24+ -->
  <rect x="245" y="49" width="595" height="22" rx="3" fill="#93c5fd"/>
  <text x="542" y="63" text-anchor="middle" fill="#1e3a8a" font-size="8" font-weight="bold">Continuous data collection &amp; quality monitoring</text>
  <!-- Continuation arrow -->
  <text x="844" y="63" text-anchor="start" fill="#1d4ed8" font-size="9" font-weight="bold">→</text>

  <!-- ══ TRACK 2: Model & Analytics  (bar y=93, h=22) ══ -->
  <!-- SARIMA forecasting: M0–M12 -->
  <rect x="160" y="93" width="340" height="22" rx="3" fill="#6d28d9"/>
  <text x="330" y="107" text-anchor="middle" fill="white" font-size="8" font-weight="bold">SARIMA forecasting</text>
  <!-- SARIMA + Prophet parallel: M12–M24 -->
  <rect x="500" y="93" width="340" height="22" rx="3" fill="#8b5cf6"/>
  <text x="670" y="107" text-anchor="middle" fill="white" font-size="8" font-weight="bold">SARIMA + Prophet (parallel validation)</text>
  <!-- Phase 3 indicator -->
  <text x="844" y="107" text-anchor="start" fill="#6d28d9" font-size="8" font-weight="bold">→ Ph.3</text>

  <!-- ══ TRACK 3: Institutional & Governance  (bar y=137, h=22) ══ -->
  <!-- Ethics & governance: M0–M3 -->
  <rect x="160" y="137" width="85"  height="22" rx="3" fill="#b45309"/>
  <text x="202" y="151" text-anchor="middle" fill="white" font-size="7.5" font-weight="bold">Ethics &amp; gov.</text>
  <!-- Stakeholder onboarding: M3–M6 -->
  <rect x="245" y="137" width="85"  height="22" rx="3" fill="#d97706"/>
  <text x="287" y="151" text-anchor="middle" fill="white" font-size="7.5" font-weight="bold">Onboarding</text>
  <!-- Alert system development: M6–M12 -->
  <rect x="330" y="137" width="170" height="22" rx="3" fill="#d97706"/>
  <text x="415" y="151" text-anchor="middle" fill="white" font-size="7.5" font-weight="bold">Alert system development</text>
  <!-- Staff training & ongoing reporting: M12–M24+ -->
  <rect x="500" y="137" width="340" height="22" rx="3" fill="#fcd34d"/>
  <text x="670" y="151" text-anchor="middle" fill="#78350f" font-size="7.5" font-weight="bold">Staff training &amp; ongoing forecast reporting</text>
  <text x="844" y="151" text-anchor="start" fill="#d97706" font-size="9" font-weight="bold">→</text>

  <!-- ══ TRACK 4: Clinical Validation  (bar y=181, h=22) ══ -->
  <!-- Counselling demand baseline: M3–M12 -->
  <rect x="245" y="181" width="255" height="22" rx="3" fill="#047857"/>
  <text x="372" y="195" text-anchor="middle" fill="white" font-size="7.5" font-weight="bold">Counselling demand baseline collection</text>
  <!-- Correlation analysis: M12–M18 -->
  <rect x="500" y="181" width="170" height="22" rx="3" fill="#059669"/>
  <text x="585" y="195" text-anchor="middle" fill="white" font-size="7.5" font-weight="bold">Correlation analysis</text>
  <!-- Clinical calibration: M18–M24+ -->
  <rect x="670" y="181" width="170" height="22" rx="3" fill="#10b981"/>
  <text x="755" y="195" text-anchor="middle" fill="white" font-size="7.5" font-weight="bold">Model calibration</text>
  <text x="844" y="195" text-anchor="start" fill="#059669" font-size="9" font-weight="bold">→</text>

  <!-- ══ PHASE BAND (y=218–244) ══ -->
  <rect x="160" y="218" width="340" height="26" rx="0" fill="#1e3a5f"/>
  <text x="330" y="234" text-anchor="middle" fill="white" font-size="8.5" font-weight="bold">Phase 1 — SARIMA Primary</text>
  <rect x="500" y="218" width="340" height="26" rx="0" fill="#155e75"/>
  <text x="670" y="234" text-anchor="middle" fill="white" font-size="8.5" font-weight="bold">Phase 2 — Parallel Validation</text>
  <rect x="840" y="218" width="18"  height="26" rx="0" fill="#065f46"/>
  <text x="849" y="234" text-anchor="middle" fill="white" font-size="7" font-weight="bold">P3</text>

  <!-- Bottom note -->
  <text x="430" y="262" text-anchor="middle" fill="#94a3b8" font-size="7.5">M = months from deployment start. Track 4 may begin at M0 if historical counselling demand data are already available.</text>
</svg>
